# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gcn+vn+ef

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /data/dataset/transform@data.dataset.pre_transform: concat_global_features+virtual_node
  - override /model: graph_level_early_fusion
  - override /model/encoder: gcn

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: last

model:
  encoder:
    hidden_channels: 64
    num_layers: 3
    dropout: 0.27
    norm: BatchNorm
  head:
    num_layers: 4
  optimizer:
    weight_decay: 2.2e-4
