# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gcn+vn_gv2

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model/encoder: gcn+vn_gv2

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 64
    num_layers: 3
    dropout: 0.017
    norm: BatchNorm
    vn_g_kwargs:
      norm_weighting: false
      global_local_agg: sum
  head:
    num_layers: 3
  optimizer:
    weight_decay: 1.5e-5
