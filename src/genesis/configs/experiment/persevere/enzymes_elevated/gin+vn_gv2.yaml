# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gin+vn_gv2

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model/encoder: gin+vn_gv2

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 32
    num_layers: 4
    dropout: 0.026
    norm: BatchNorm
    vn_g_kwargs:
      norm_weightning: false
      global_local_agg: sum
  head:
    num_layers: 3
  optimizer:
    weight_decay: 7.3e-5
