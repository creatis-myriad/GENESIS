# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gcn+vn_g

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model/encoder: gcn+vn_g

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: sum

model:
  encoder:
    hidden_channels: 64
    num_layers: 7
    dropout: 0.05
    norm: BatchNorm
    vn_g_kwargs:
      norm_weighting: false
      global_local_agg: sum
  head:
    num_layers: 3
  optimizer:
    weight_decay: 2.1e-5
