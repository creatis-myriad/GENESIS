# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gin+galf

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model: graph_level_late_fusion
  - override /model/encoder: gin

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: sum

model:
  encoder:
    hidden_channels: 16
    num_layers: 9
    dropout: 0.041
    norm: BatchNorm
  head:
    num_layers: 4
  optimizer:
    weight_decay: 1.2e-4
