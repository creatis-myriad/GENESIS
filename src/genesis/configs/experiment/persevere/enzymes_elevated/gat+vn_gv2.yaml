# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gat+vn_gv2

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model/encoder: gat+vn_gv2

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 32
    num_layers: 7
    dropout: 0.041
    norm: BatchNorm
    vn_g_kwargs:
      norm_weighting: false
      global_local_agg: mean
  head:
    num_layers: 1
  optimizer:
    weight_decay: 1.8e-4
