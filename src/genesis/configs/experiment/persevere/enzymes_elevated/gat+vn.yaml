# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gat+vn

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /data/dataset/transform: virtual_node
  - override /model/encoder: gat

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 16
    num_layers: 5
    dropout: 3.8e-3
    norm: BatchNorm
  head:
    num_layers: 3
  optimizer:
    weight_decay: 4.5e-4
