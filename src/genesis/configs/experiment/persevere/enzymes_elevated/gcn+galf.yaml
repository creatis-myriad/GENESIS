# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gcn+galf

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model: graph_level_late_fusion
  - override /model/encoder: gcn

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 64
    num_layers: 8
    dropout: 0.35
    norm: InstanceNorm
  head:
    num_layers: 4
  optimizer:
    weight_decay: 1.5e-4
