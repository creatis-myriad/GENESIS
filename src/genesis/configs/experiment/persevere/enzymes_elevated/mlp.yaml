# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/mlp

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model/encoder: mlp

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: sum

model:
  encoder:
    hidden_channels: 64
    num_layers: 10
    dropout: 0.047
    norm: InstanceNorm
  head:
    num_layers: 1
  optimizer:
    weight_decay: 1.7e-5
