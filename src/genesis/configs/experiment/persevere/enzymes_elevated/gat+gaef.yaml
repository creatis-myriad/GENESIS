# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gat+gaef

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /data/dataset/transform@data.dataset.pre_transform: concat_global_features
  - override /model: graph_level_early_fusion
  - override /model/encoder: gat

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 64
    num_layers: 2
    dropout: 0.13
    norm: BatchNorm
  head:
    num_layers: 3
  optimizer:
    weight_decay: 5.7e-5
