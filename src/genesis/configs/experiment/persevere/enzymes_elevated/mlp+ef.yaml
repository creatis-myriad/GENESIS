# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/mlp+ef

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model: graph_level_early_fusion
  - override /model/encoder: mlp

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 64
    num_layers: 2
    dropout: 0.29
    norm: BatchNorm
  head:
    num_layers: 4
  optimizer:
    weight_decay: 6.3e-5
