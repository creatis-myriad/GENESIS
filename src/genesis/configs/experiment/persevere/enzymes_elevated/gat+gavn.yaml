# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gat+gavn

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model/transforms: graph_attr_virtual_nodes
  - override /model/encoder: gat

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 16
    num_layers: 2
    dropout: 0.22
    norm: BatchNorm
  head:
    num_layers: 4
  optimizer:
    weight_decay: 6.6e-5
