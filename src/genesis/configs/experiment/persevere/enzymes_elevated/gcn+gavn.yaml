# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gcn+gavn

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model/transforms: graph_attr_virtual_node
  - override /model/encoder: gcn

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 32
    num_layers: 2
    dropout: 0.096
    norm: BatchNorm
  head:
    num_layers: 3
  optimizer:
    weight_decay: 2.3e-4
