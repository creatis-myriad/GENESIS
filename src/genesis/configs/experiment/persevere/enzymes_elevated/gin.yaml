# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gin

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model/encoder: gin

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: sum

model:
  encoder:
    hidden_channels: 32
    num_layers: 3
    dropout: 0.041
    norm: GraphNorm
  head:
    num_layers: 3
  optimizer:
    weight_decay: 7.7e-4
