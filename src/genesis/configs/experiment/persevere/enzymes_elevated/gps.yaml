# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gps

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /model/encoder: gps

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 32
    pe_embed_dim: 4
    num_layers: 8
    gps_kwargs:
      heads: 2
      dropout: 0.047
      norm: BatchNorm
      attn_kwargs:
        dropout: 0.096
  head:
    num_layers: 3
  optimizer:
    weight_decay: 4.5e-4
