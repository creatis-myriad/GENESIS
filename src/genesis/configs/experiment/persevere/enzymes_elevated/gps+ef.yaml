# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/enzymes_elevated/gps+ef

defaults:
  - /experiment/persevere/enzymes_elevated/_base
  - override /data/dataset/transform@data.dataset.pre_transform: random_walk_pe+concat_global_features
  - override /model: graph_level_early_fusion
  - override /model/encoder: gps

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 64
    pe_embed_dim: 8
    num_layers: 7
    gps_kwargs:
      heads: 4
      dropout: 0.13
      norm: BatchNorm
      attn_kwargs:
        dropout: 0.19
  head:
    num_layers: 2
  optimizer:
    weight_decay: 5.7e-4
