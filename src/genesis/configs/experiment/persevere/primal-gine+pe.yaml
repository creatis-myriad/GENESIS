# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/gin+pe(primal)

defaults:
  - persevere/default
  - override /data/dataset/transform@data.dataset.transform: random_walk_pe
  - override /model/encoder: gine

# Use the default config, and only define parameters to use primal representation (meaning all features on the edges)
# with positional encoding for node features
hparams:
  data:
    num_node_features: 0 # No base node features
    pe_attr: null

data:
  dataset:
    line_graph: False # Use the primal representation

# For the model, use the hparams tuned for GIN
model:
  encoder:
    hidden_channels: 64
    num_layers: 2
    dropout: 0.34
  optimizer:
    weight_decay: 1.3e-5
