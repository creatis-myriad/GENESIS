# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gat-vcn

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model/transforms: graph_attr_virtual_nodes
  - override /model/encoder: gat
  # Virtual column network (VCN) formulation of virtual nodes (Pham et al., 2017), proposes to use the final vector
  # representation of virtual nodes as the graph representation, i.e. readout result.
  # Since virtual nodes are appended at the end of the graph, after real nodes, we can extract them by taking the last
  # node in the graph.
  - override /model/readout: last

# Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
model:
  encoder:
    hidden_channels: 32
    num_layers: 6
    dropout: 8.5e-5
  optimizer:
    weight_decay: 1.6e-5
