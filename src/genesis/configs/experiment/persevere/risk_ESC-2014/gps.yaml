# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gps

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model/encoder: gps

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: sum

model:
  encoder:
    hidden_channels: 16
    pe_embed_dim: 4
    num_layers: 8
    gps_kwargs:
      heads: 2
      dropout: 0.055
      norm: BatchNorm
      attn_kwargs:
        dropout: 0.18
  head:
    num_layers: 2
  optimizer:
    weight_decay: 6.3e-5
