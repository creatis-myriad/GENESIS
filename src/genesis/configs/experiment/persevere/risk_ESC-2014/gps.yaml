# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gps

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model/encoder: gps

# Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
model:
  encoder:
    hidden_channels: 16
    pe_embed_dim: 4
    num_layers: 5
    gps_kwargs:
      heads: 4
      attn_kwargs:
        dropout: 0.47
  optimizer:
    weight_decay: 4.9e-4
