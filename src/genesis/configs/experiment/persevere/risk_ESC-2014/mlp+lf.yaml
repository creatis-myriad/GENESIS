# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/mlp+lf

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model: graph_level_late_fusion
  - override /model/encoder: mlp

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 32
    num_layers: 3
    dropout: 0.16
    norm: BatchNorm
  head:
    num_layers: 4
  optimizer:
    weight_decay: 2.8e-5
