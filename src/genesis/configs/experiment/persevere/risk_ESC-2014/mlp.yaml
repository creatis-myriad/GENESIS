# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/mlp

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model/encoder: mlp

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: sum

model:
  encoder:
    hidden_channels: 32
    num_layers: 2
    dropout: 0.29
    norm: BatchNorm
  head:
    num_layers: 4
  optimizer:
    weight_decay: 1.8e-4
