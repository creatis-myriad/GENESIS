# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gat+vn_g

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model/encoder: gat+vn_g

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 32
    num_layers: 6
    dropout: 0.064
    norm: BatchNorm
    vn_g_kwargs:
      norm_weighting: false
      global_local_agg: mean
  head:
    num_layers: 1
  optimizer:
    weight_decay: 3.7e-4
