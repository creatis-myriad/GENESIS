# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gat+lf

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model: graph_level_late_fusion
  - override /model/encoder: gat

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 64
    num_layers: 9
    dropout: 0.27
    norm: GraphNorm
  head:
    num_layers: 3
  optimizer:
    weight_decay: 9.4e-5
