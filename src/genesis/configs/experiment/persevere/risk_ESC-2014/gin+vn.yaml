# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gin+vn

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model/encoder: gin+vn

# Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
model:
  encoder:
    hidden_channels: 64
    num_layers: 3
    dropout: 0.073
  optimizer:
    weight_decay: 6e-5
