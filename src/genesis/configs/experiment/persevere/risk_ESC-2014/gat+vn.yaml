# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gat+vn

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /data/dataset/transform: virtual_node
  - override /model/encoder: gat

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: last

model:
  encoder:
    hidden_channels: 32
    num_layers: 3
    dropout: 0.021
    norm: BatchNorm
  head:
    num_layers: 5
  optimizer:
    weight_decay: 4.8e-4
