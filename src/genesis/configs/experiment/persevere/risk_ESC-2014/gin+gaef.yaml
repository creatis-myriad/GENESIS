# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gin+gaef

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /data/dataset/transform: concat_global_features
  - override /model: graph_level_early_fusion
  - override /model/encoder: gin

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 64
    num_layers: 2
    dropout: 0.40
    norm: BatchNorm
  head:
    num_layers: 4
  optimizer:
    weight_decay: 6.9e-4
