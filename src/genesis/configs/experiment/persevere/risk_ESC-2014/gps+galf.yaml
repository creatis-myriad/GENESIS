# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gps+galf

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model: graph_level_late_fusion
  - override /model/encoder: gps

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: sum

model:
  encoder:
    hidden_channels: 64
    pe_embed_dim: 8
    num_layers: 2
    gps_kwargs:
      heads: 2
      dropout: 0.25
      norm: InstanceNorm
      attn_kwargs:
        dropout: 0.32
  head:
    num_layers: 3
  optimizer:
    weight_decay: 6e-5
