# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gps+xa

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model: graph_level_gps+ga
  - override /model/encoder: gps+xa

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: sum

model:
  encoder:
    hidden_channels: 16
    pe_embed_dim: 8
    num_layers: 5
    gps_kwargs:
      heads: 1
      dropout: 0.35
      norm: BatchNorm
      attn_kwargs:
        dropout: 0.21
  features_for_readout: node
  head:
    num_layers: 2
  optimizer:
    weight_decay: 5.5e-4
