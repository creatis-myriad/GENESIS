# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/mlp+ef

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model: graph_level_early_fusion
  - override /model/encoder: mlp

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: last

model:
  encoder:
    hidden_channels: 64
    num_layers: 3
    dropout: 0.18
    norm: BatchNorm
  head:
    num_layers: 5
  optimizer:
    weight_decay: 2.6e-4
