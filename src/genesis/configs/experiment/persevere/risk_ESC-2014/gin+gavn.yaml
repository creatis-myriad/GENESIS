# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gin+gavn

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model/transforms: graph_attr_virtual_node
  - override /model/encoder: gin

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 32
    num_layers: 2
    dropout: 0.16
    norm: BatchNorm
  head:
    num_layers: 5
  optimizer:
    weight_decay: 6e-4
