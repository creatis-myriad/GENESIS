# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gps+gaef

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /data/dataset/transform@data.dataset.pre_transform: random_walk_pe+concat_global_features
  - override /model: graph_level_early_fusion
  - override /model/encoder: gps

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: sum

model:
  encoder:
    hidden_channels: 32
    pe_embed_dim: 8
    num_layers: 3
    gps_kwargs:
      heads: 2
      dropout: 0.50
      norm: BatchNorm
      attn_kwargs:
        dropout: 0.54
  head:
    num_layers: 3
  optimizer:
    weight_decay: 8.2e-4
