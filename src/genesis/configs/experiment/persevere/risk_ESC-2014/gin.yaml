# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gin

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model/encoder: gin

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: sum

model:
  encoder:
    hidden_channels: 32
    num_layers: 3
    dropout: 0.061
    norm: BatchNorm
  head:
    num_layers: 3
  optimizer:
    weight_decay: 1.2e-5
