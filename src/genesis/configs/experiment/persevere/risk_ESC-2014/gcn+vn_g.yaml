# @package _global_

# to execute this experiment run:
# python train.py experiment=persevere/risk_ESC-2014/gcn+vn_g

defaults:
  - /experiment/persevere/risk_ESC-2014/_base
  - override /model/encoder: gcn+vn_g

  # Use the default config, and only define hparams tuned for the dataset+model using automated hyperparameter search
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 32
    num_layers: 8
    dropout: 0.077
    norm: BatchNorm
    vn_g_kwargs:
      norm_weighting: false
      global_local_agg: sum
  head:
    num_layers: 3
  optimizer:
    weight_decay: 5.6e-4
