# @package _global_

# to execute this experiment run:
# python train.py experiment=ablation/node_features/gin-vcn+pe

# Use the default GIN-VCN config (node features + virtual node initialized w/ graph-level features), modified to:
# - add PE
# - remove original node features (i.e. use only PE as node features)
defaults:
  - /experiment/persevere/risk_ESC-2014/gin-vcn
  - override /data/dataset/transform@data.dataset.transform: random_walk_pe

hparams:
  data:
    pe_attr: null # Concatenate positional encoding to node features

logger:
  wandb:
    project: "GENESIS-ablation" # set a dedicated project for ablation studies
