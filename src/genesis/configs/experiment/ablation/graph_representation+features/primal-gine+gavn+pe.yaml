# @package _global_

# to execute this experiment run:
# python train.py experiment=ablation/graph_representation+features/primal-gine+gavn+pe

# Use the default GIN+GraphAttrVN config, modified to:
# - use primal representation (i.e. not line graph)
# - use GINE (instead of GIN) to support edge features
# - add PE
defaults:
  - /experiment/persevere/enzymes_elevated/gin+gavn
  - override /data/dataset/transform@data.dataset.transform: random_walk_pe
  - override /model/encoder: gine

hparams:
  data:
    num_node_features: 0 # No node features in primal representation, since all features are on edges
    pe_attr: null # Concatenate positional encoding to node features

data:
  dataset:
    line_graph: False # Use the primal representation

logger:
  wandb:
    project: "GENESIS-ablation" # set a dedicated project for ablation studies
