# @package _global_

# to execute this experiment run:
# python train.py experiment=ablation/graph_representation+features/dual-gin+gavn+pe-only

# Use the default GIN+GraphAttrVN config, modified to:
# - add PE
# - remove original node features (i.e. use only PE as node features)
defaults:
  - /experiment/persevere/enzymes_elevated/gin+gavn
  - override /data/dataset/transform@data.dataset.transform: random_walk_pe

hparams:
  data:
    pe_attr: null # Concatenate positional encoding to node features

data:
  dataset:
    # Remove all features by filtering them using an empty list
    # (not null/None, as this would default to include all available features)
    # Since we are using the dual representation, we filter edge features as they will end up as node features
    edge_attrs_filter: []

logger:
  wandb:
    project: "GENESIS-ablation" # set a dedicated project for ablation studies
