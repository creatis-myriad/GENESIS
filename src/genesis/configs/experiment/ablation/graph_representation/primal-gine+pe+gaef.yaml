# @package _global_

# to execute this experiment run:
# python train.py experiment=ablation/graph_representation/primal-gine+pe+gaef

# Use the default GIN+GAEF config, consisting of:
# - dual representation
# - node features
# - no positional encoding
# - graph-level features concatenated to node features before the GNN encoder
# modified to:
# - use primal representation (i.e. not line graph)
# - use GINE (instead of GIN) to support edge features
# - add PE (making sure not to override the transform to concatenate graph-level features to node features)
defaults:
  - /experiment/persevere/risk_ESC-2014/gin+gaef
  - override /data/dataset/transform@data.dataset.pre_transform: random_walk_pe+concat_global_features
  - override /model/encoder: gine

hparams:
  data:
    num_node_features: 0 # No node features in primal representation, since all features are on edges
    pe_attr: null # Concatenate positional encoding to node features

data:
  dataset:
    line_graph: False # Use the primal representation
