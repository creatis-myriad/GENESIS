# @package _global_

# to execute this experiment run:
# python train.py experiment=ablation/graph_representation/primal-gine+pe+galf

# Use the default GIN+GALF config, consisting of:
# - dual representation
# - node features, no edge features
# - no positional encoding
# - graph-level features concatenated after readout
# modified to:
# - use primal representation (i.e. not line graph)
# - use GINE (instead of GIN) to support node features having become edge features
# - add PE
defaults:
  - /experiment/persevere/risk_ESC-2014/gin+galf
  - override /data/dataset/transform@data.dataset.pre_transform: random_walk_pe
  - override /model/encoder: gine

hparams:
  data:
    num_node_features: 0 # No node features in primal representation, since all features are on edges
    pe_attr: null # Concatenate positional encoding to node features

data:
  dataset:
    line_graph: False # Use the primal representation
