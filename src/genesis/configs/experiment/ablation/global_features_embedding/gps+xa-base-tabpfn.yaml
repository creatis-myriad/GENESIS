# @package _global_

# to execute this experiment run:
# python train.py experiment=ablation/global_features_embedding/gps+xa-base-tabpfn

# Use the default GPS+xA config, modified to:
# - replace global features with their TabPFN embedding
# - move `random_walk_pe` from pre_transform to transform, to come after `tabpfn_embedding` in the pipeline
# Note:
# - uses the "base" GPS encoder hparams (optimized for GPS+xA configuration)
defaults:
  - /experiment/persevere/risk_ESC-2014/gps+xa
  - override /data/dataset/transform@data.dataset.pre_transform: tabpfn_embedding
  - override /data/dataset/transform: random_walk_pe

callbacks:
  # Disable early stopping by default for this experiment
  # Since Hydra does not support removing config nodes in YAML files, we have to set it to null/None
  early_stopping: null
