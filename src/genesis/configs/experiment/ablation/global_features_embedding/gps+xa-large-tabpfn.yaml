# @package _global_

# to execute this experiment run:
# python train.py experiment=ablation/global_features_embedding/gps+xa-large-tabpfn

# Use the default GPS+FTxA config, modified to:
# - replace global features with their TabPFN embedding
# - use linear projection (instead of Feature Tokenizer) on TabPFN embedding
# - move `random_walk_pe` from pre_transform to transform, to come after `tabpfn_embedding` in the pipeline
# Note:
# - uses the "large" GPS encoder hparams (optimized for GPS+FTxA configuration)
defaults:
  - /experiment/persevere/risk_ESC-2014/gps+ftxa
  - override /data/dataset/transform@data.dataset.pre_transform: tabpfn_embedding
  - override /data/dataset/transform: random_walk_pe
  - override /model/encoder: gps+xa # use linear projection (instead of Feature Tokenizer) after TabPFN embedding

callbacks:
  # Disable early stopping by default for this experiment
  # Since Hydra does not support removing config nodes in YAML files, we have to set it to null/None
  early_stopping: null
