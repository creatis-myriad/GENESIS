# @package _global_

# to execute this experiment run:
# python train.py experiment=ablation/node_features/gin-vn-mean

# Use the default GIN-VCN config (virtual node initialized w/ graph-level features + readout extracting the virtual node), modified to:
# - change readout to average all node representations, instead of just taking the virtual node representation
defaults:
  - /experiment/persevere/enzymes_elevated/gin-vcn
  - override /model/readout: mean

logger:
  wandb:
    project: "GENESIS-ablation" # set a dedicated project for ablation studies
