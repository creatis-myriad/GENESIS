# @package _global_

# to execute this experiment run:
# python train.py experiment=generalization/zinc/gps+ef

defaults:
  - /experiment/generalization/zinc/gps
  # Use the GPS config, modified to:
  # 1) compute molecular global features, and;
  # 2) concat the global features to nodes to perform early fusion

  # Use custom transform config that pairs computation of molecular global features with
  # transform required by the GNN backbone (i.e. random walk positional encoding)
  # and the fusion strategy (i.e. concatenation of global features to node features)
  - override /data/dataset/transform@data.dataset.pre_transform: random_walk_pe+add+concat_molecular_global_features
  - override /model: graph_level_early_fusion
