# @package _global_

# Base experiment configuration for graph-level GINE model on the MolHIV dataset.
# Meant to set common hparams for the dataset+model, to be extended by child configs to override with mutually exclusive
# transforms, which Hydra's additive config composition would prevent from overriding if a default were defined here.

defaults:
  - /experiment/generalization/molhiv/_base
  # Use the default config, but define hparams tuned for the dataset+model reported in the papers that introduced
  # GINE:
  # Hu et al. 2019, "Strategies for Pre-training Graph Neural Networks", https://openreview.net/forum?id=HJlWWJSFDH
  # and the OGB benchmark datasets:
  # Hu et al. 2020, "Open Graph Benchmark: Datasets for Machine Learning on Graphs",
  # https://proceedings.neurips.cc/paper/2020/hash/fb60d411a5c5b72b2e7d3527cfc84fd0-Abstract.html

  - override /model/encoder: gine
  - override /model/optimizer: adamw # identical to Adam when weight decay is set to 0, as is the case here
  - override /model/scheduler: reduce_lr_on_plateau
  - override /model/readout: mean

model:
  encoder:
    hidden_channels: 300
    num_layers: 5
    dropout: 0.5
    norm: BatchNorm
  head:
    num_layers: 2

  optimizer:
    lr: 0.001
    weight_decay: 0.0
  scheduler:
    factor: 0.5
    patience: 10
    min_lr: 1e-5
