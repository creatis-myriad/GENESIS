# @package _global_

# to execute this experiment run:
# python train.py experiment=generalization/molhiv/gine+vn+ef

defaults:
  - /experiment/generalization/molhiv/gine+vn
  # Use the GINE+VN config, modified to:
  # 1) compute molecular global features, and;
  # 2) concat the global features to nodes to perform early fusion

  # Use custom transform config that pairs computation of molecular global features with
  # transform required for the fusion strategy (i.e. concatenation of global features to node features)
  - override /data/dataset/transform@data.dataset.pre_transform: add+concat_molecular_global_features
  - override /model: graph_level_early_fusion
