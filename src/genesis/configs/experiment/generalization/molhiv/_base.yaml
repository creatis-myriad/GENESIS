# @package _global_

# Base experiment configuration for graph-level binary classification on the MolHIV dataset.
# Not optimal when used directly, as it uses the default graph-level model.

defaults:
  - /callbacks:
      - lr_monitor # Add learning rate monitor callback to default callbacks
  - override /data: ogb_lightning_dataset
  - override /data/dataset: ogbg-molhiv
  - override /model: graph_level
  # On molecular datasets, common practice is to encode node (atom) and edge (bond) features using learnable embeddings
  - override /model/transforms: atom_bond_embedding
  # Metrics are part of the model, used to evaluate it during training, but they depend on the data task.
  # Intuitively, the metrics config should be interpolated based on the data config. However, limitations in the
  # interpolation capabilities of Hydra make this impractical.
  # In this context, the least bad solution is to assign the metrics manually at the experiment (or main config) level.
  - override /model/metrics: binary_classification

# all parameters below will be merged with parameters from default configurations ('train.yaml' or 'eval.yaml')
# this allows you to overwrite only specified parameters

tags:
  - ${hydra:runtime.choices.experiment} # automatically tag with the chosen experiment
  - ${hydra:runtime.choices.model/encoder} # automatically tag with the chosen model architecture
  - ${hydra:runtime.choices.data/dataset} # automatically tag with the chosen dataset

seed: 12345

trainer:
  min_epochs: 5
  max_epochs: 100

callbacks:
  # Override default callbacks monitoring loss to monitor AUROC instead
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"

data:
  batch_size: 32

model:
  transforms:
    atom_bond_embedding:
      # Set encoding of raw molecular atom/bond features to match the encoder's hidden dimension
      atom_embed_dim: ${...encoder.hidden_channels}
      bond_embed_dim: ${...encoder.hidden_channels}

logger:
  wandb:
    project: "GENESIS-molecular"
    tags: ${tags}
    group: ${tags.0} # by default, group runs by the first tag

# Assert data config values are compatible with the model
# Implementing these assertions in the config file allows Hydra to check them
# and stop the program from running if the configs are known to be incompatible
_assert_:
  data_more_than_one_graph: ${assert:${op:gt,${oc.select:hparams.data.num_graphs,0},1}}
