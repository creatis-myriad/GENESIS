# @package _global_

# to execute this experiment run:
# python tabular_baseline.py experiment=tabular_baseline/no_enzymes

defaults:
  - tabular_baseline/_base

# Use the base config, and only define which set of columns/attributes to use from the dataset
data:
  dataset:
    usecols:
      - patient_id
      - risk_ESC-2014
      - spesi
      - history_cancer
      - history_cpd
      - heart_rate
      - systolic_bp
      - spO2
      - age
      - inverted_rv-lv_ratio
