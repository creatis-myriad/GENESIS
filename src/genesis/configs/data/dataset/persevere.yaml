# @package _global_

defaults:
  # Place _self_ before filters and transforms in the defaults list, in case they override dataset hparams,
  # e.g. modify number of graphs, features, etc.
  - _self_
  # To filter graph attributes to include in the dataset, use the following config group:
  - /data/dataset/graph_attrs_filter: spesi+cardiac_biomarkers+graph_biomarkers
  # To add transforms (or pre-transforms) to the dataset, use the following config group:
  - /data/dataset/transform: null
  - /data/dataset/transform@data.dataset.pre_transform: null
  - /data/dataset/target: risk_ESC-2014

data:
  dataset:
    _target_: genesis.data.persevere.PersevereDataset
    # Make sure that filters are converted to native list, since PyG sometimes expects native lists,
    # i.e. in util function `from_networkx`, behavior changes silently if attrs are specifically Python native lists
    _convert_: all
    root: ${paths.data_dir}/PERSEVERE
    line_graph: True
    target_attr: ??? # To be set by the target config
    target_dtype:
      # Workaround to have hydra import the torch dtype, suggested in the comment referenced below:
      # https://github.com/facebookresearch/hydra/issues/2140#issuecomment-2334918114
      _target_: torch.__dict__.get
      _args_:
        # Cast target to float for regression tasks, and long otherwise (binary/multiclass classification)
        - ${op.ternary:${op:eq,${hparams.data.task},regression}, float, long}

hparams:
  # hparams.data.* values are meant to expose the constant properties of the `torch_geometric.data.Dataset` instance
  # to make them available during the resolution of the configuration, using the same names.
  # This is done to allow for automatic interpolation of data-processing components (e.g. stratified splits)
  # and model architecture components (e.g. input/output dimensions) during the resolution of the configuration.
  # Therefore, it is important to provide the values available for your dataset, whether it is a PyTorch Geometric
  # dataset or your own custom dataset.
  data:
    num_graphs: 353
    # If no explicit filter of edge attributes is provided, the maximum number of edge features (9) is used
    num_raw_edge_features: 9
    num_raw_graph_features: 29
    num_filtered_edge_features: ${op:length_hint,${oc.select:data.dataset.edge_attrs_filter}, ${.num_raw_edge_features}}
    num_edge_features: ${op.ternary:${data.dataset.line_graph}, null, ${.num_filtered_edge_features}}
    num_node_features: ${op.ternary:${data.dataset.line_graph}, ${.num_filtered_edge_features}, null}
    # Infer the number of global features from the selected graph attributes, and default to all but the target
    # attribute if no filter is provided
    num_graph_features: ${op:length_hint, ${oc.select:data.dataset.graph_attrs_filter}, ${op:sub,${.num_raw_graph_features},1}}
    graph_cat_features_cardinalities: ??? # To be set by the graph_attrs_filter config
    task: ??? # To be set by the target config
