defaults:
  - _self_
  - target: vte_severity

_target_: genesis.data.CSVDataset
# since pandas.read_csv does not recognize OmegaConf containers as their corresponding Python primitives
# (when forwarding them to the read_csv function), force the conversion of OmegaConf containers to Python primitives
_convert_: all
src: ${paths.data_dir}/PERSEVERE/clinical_data.csv
target_attr: null # To be set by the target config
index_col: patient_id
usecols:
  - patient_id
  - vte_severity
  - troponin
  - bnp
dtype:
  patient_id: str
  vte_severity: int
  troponin: float
  bnp: float
na_values: ["NF"]
