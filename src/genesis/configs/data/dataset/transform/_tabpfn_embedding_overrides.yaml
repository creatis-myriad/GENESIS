# @package _global_

hparams:
  data:
    agg_tabpfn_embeddings: true
    # If embeddings from the multiple estimators used by TabPFN (default: 6) should be reduced to a single embedding,
    # the size of the graph-level features is equal to the embedding size (default: 192).
    # Otherwise, the embeddings are concatenated along the feature dimension, so the size of the graph-level features
    # equals `embedding size (192) * num estimators (6)`.
    num_graph_features: ${op.ternary:${.agg_tabpfn_embeddings}, 192, ${op:mul,192,6}}
