defaults:
  - _molecular_global_features_hparams

_target_: torch_geometric.transforms.Compose
transforms:
  - _target_: genesis.data.transforms.molecules.AddMolecularGlobalFeatures
    features: ${hparams.data.graph_features}
    attr_name: graph_attr
  - _target_: genesis.data.transforms.features.ConcatFeatures
    attrs:
      x: node
      graph_attr: graph
    level: node
    concat_attr: x
