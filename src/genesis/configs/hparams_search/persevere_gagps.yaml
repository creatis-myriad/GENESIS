# @package _global_

# example hyperparameter optimization of some experiment with Optuna:
# python train.py -m hparams_search=persevere_gagps experiment=persevere/<PERSEVERE_GAGPS_EXPERIMENT>

defaults:
  - /hparams_search/persevere_gps # inherit from PERSEVERE search config for GPS
  - override /model: graph_level_gagps
  - override /model/encoder: gagps

hydra:
  sweeper:
    # Inherit from hyperparameter search space defined for GPS, and modify it to:
    # - add parameters specific to GAGPS variant
    params:
      model.features_for_readout: choice(node, graph)
