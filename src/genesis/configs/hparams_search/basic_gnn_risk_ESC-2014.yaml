# @package _global_

# example hyperparameter optimization of some experiment with Optuna:
# python train.py -m hparams_search=basic_gnn_risk_ESC-2014 model/encoder=<GNN_MODEL>

defaults:
  - _persevere_optuna # inherit from base hparams PERSEVERE search config

hydra:
  sweeper:
    # define hyperparameter search space
    params:
      model.encoder.hidden_channels: choice(16, 32, 64)
      model.encoder.num_layers: range(2, 9)
      model.encoder.dropout: interval(0.0, 0.6) # uniform sampling between 0.0 and 0.6
      model.readout._target_: choice(torch_geometric.nn.global_add_pool, torch_geometric.nn.global_mean_pool, torch_geometric.nn.global_max_pool)
      model.head.num_layers: choice(1, 2)
      model.optimizer.weight_decay: tag(log, interval(1e-5,1e-3)) # log-uniform sampling between 1e-5 and 1e-3
      weighted_loss: choice(true, false)
