# @package _global_

defaults:
  - paths: default
  - hydra: default
  - data/dataset@clinical_data: persevere_clinical
  - override data/dataset/imputer@clinical_data.imputer: iterative
  - _self_

source_dir: ${paths.data_dir}/PERSEVERE/graphs
pyg_raw_dir: ${paths.data_dir}/PERSEVERE/raw
node_link_data_nodes_key: nodes
node_link_data_edges_key: edges

attrs_to_remove:
  nodes: [pos, radius]
  links: [
      id,
      name,
      lateral,
      lobe,
      lobes,
      centerline,
      radius,
      contour_points,
      ep_id,
      ep_coordinates,
      segments_below,
      total_embolism_volume_cm3, # since total_embolism_volume_mm3 already exists
      total_vessel_volume_cm3, # since total_vessel_volume_mm3 already exists
      embolisms_ids,
      embolisms_voxel_counts,
      embolisms_volumes_mm3,
      embolisms_volumes_cm3,
      has_embolism,
    ]

attrs_to_aggregate:
  links:
    transversal_obstruction: [max] # list among max, min, mean and sum
  remove_original: true # remove the original attributes after aggregation

obstruction_attrs:
  add: true # add embolism attributes to the graph
  cumulated_attr:
    input: max_transversal_obstruction # input attribute to cumulate
    output: max_transversal_obstruction_cumulated # output attribute name
  propagated_attr:
    input: max_transversal_obstruction # input attribute to propagate
    output: max_transversal_obstruction_propagated # output attribute name

clinical_data:
  target_attr: null # Disable the default target attribute, since we do not want to treat it differently at this stage
  drop_na: true # Do not silently propagate missing value NaNs

# disable output directory, since the script should be run interactively, and we don't need to save the output
hydra:
  output_subdir: null
  run:
    dir: .
