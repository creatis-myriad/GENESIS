# @package _global_

defaults:
  - paths: default
  - hydra: default
  - data/dataset@clinical_data: persevere_clinical
  - override data/dataset/imputer@clinical_data.imputer: iterative
  - _self_

source_dir: ${paths.data_dir}/PERSEVERE/graphs
pyg_raw_dir: ${paths.data_dir}/PERSEVERE/raw
node_link_data_nodes_key: nodes
node_link_data_edges_key: edges

attrs_to_aggregate: # aggregation function among max, min, mean and sum
  links:
    radius: [min, max, mean]
    transversal_obstruction: max

attrs_to_remove:
  nodes: [pos, radius]
  links: [
      id,
      name,
      lateral,
      lobe,
      lobes,
      centerline,
      radius, # since we extract the min, max, mean from the list
      min_radius, # since we recompute the aggregated radius attributes from the list of radii
      max_radius, # since we recompute the aggregated radius attributes from the list of radii
      mean_radius, # since we recompute the aggregated radius attributes from the list of radii
      contour_points,
      ep_id,
      ep_coordinates,
      segments_below,
      total_vessel_volume_mm3, # since total_vessel_voxels already exists
      total_vessel_volume_cm3, # since total_vessel_voxels already exists
      total_embolism_volume_mm3, # since total_embolism_voxels already exists
      total_embolism_volume_cm3, # since total_embolism_voxels already exists
      transversal_obstruction, # since we extract the max from the list
      embolisms_ids,
      embolisms_voxel_counts,
      embolisms_volumes_mm3,
      embolisms_volumes_cm3,
      has_embolism,
    ]

clinical_data:
  target_attr: null # Disable the default target attribute, since we do not want to treat it differently at this stage
  drop_na: true # Do not silently propagate missing value NaNs

# disable output directory, since the script should be run interactively, and we don't need to save the output
hydra:
  output_subdir: null
  run:
    dir: .
